# Single-package repository. pnpm >=10 rejects a workspace file without this field
# ("ERROR packages field missing or empty"), which is what broke the Railway build:
# Railpack installs with pnpm 10 while local development runs pnpm 11, where the
# field is optional. Keep it even if the local version stops needing it.
packages:
  - .

allowBuilds:
  esbuild: true
  sharp: true

# Security overrides (FEAT-001 SAST gate): patched versions of vulnerable transitive dependencies
# pulled in by @lhci/cli 0.15.1 (latest), which still pins the vulnerable ranges.
overrides:
  tmp: ^0.2.6
  qs: ^6.16.0
  uuid: ^11.1.1
  # extract-zip has no patched release (<=2.0.1 affected); @puppeteer/browsers 3 drops it.
  '@puppeteer/browsers': ^3.2.2
